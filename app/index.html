<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Offline GTA VI trophy guide and tracker: 55 PS5 trophies, cited step-by-step guides, source disputes, roadmap, missables.">
<title>Leonida Trophy Guide – GTA VI tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Leonida Trophy Guide <small>GTA VI</small></h1>
  <section id="progress" aria-label="Progress">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar-fill"></div></div>
    <span class="progress-text"></span>
    <span class="grade-counts"></span>
  </section>
  <label class="shield"><input id="spoilers" type="checkbox"> Spoiler shield <b id="masked-count"></b></label>
  <button id="export" type="button">Export</button>
  <label class="file">Import <input id="import" type="file" accept="application/json,.json"></label>
  <button id="reset" type="button" class="quiet">Reset</button>
  <span class="saved">Saved in this browser</span>
  <span id="message" class="muted" role="status"></span>
</header>
<section id="kpi" class="kpis" aria-label="Audit"></section>
<nav class="tabs" aria-label="Views">
  <a href="#tracker" data-tab="tracker">Tracker</a>
  <a href="#roadmap" data-tab="roadmap">Roadmap</a>
  <a href="#missables" data-tab="missables">Missables</a>
  <a href="#sources" data-tab="sources">Sources</a>
</nav>
<main>
  <div id="view-tracker" class="view tracker">
    <aside class="pane left" aria-label="Filters and next up">
      <input id="search" type="search" placeholder="Search trophies and guides" aria-label="Search">
      <div class="row2">
        <select id="grade" aria-label="Grade"><option value="all">All grades</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select>
        <label><input id="hide-earned" type="checkbox"> Hide earned</label>
      </div>
      <h4>FILTERS</h4>
      <div id="kinds" class="kinds" role="group" aria-label="Filter"></div>
      <h4>NEXT UP · ROADMAP ORDER</h4>
      <ol id="nextup" class="nextup"></ol>
    </aside>
    <section class="pane mid" aria-label="Checklist and guide">
      <div class="listcol"><div class="listhead"><b>Checklist</b> <span id="result-count" class="muted"></span></div><ul id="list" class="list"></ul></div>
      <article id="guide" class="guide" aria-label="Guide"></article>
    </section>
    <aside id="sources-panel" class="pane right" aria-label="Sources for this guide"></aside>
  </div>
  <div id="view-roadmap" class="view page" hidden></div>
  <div id="view-missables" class="view page" hidden></div>
  <div id="view-sources" class="view page" hidden></div>
</main>
<footer>Unofficial fan project. Trophy names and descriptions belong to their owners; guides are original text. Works offline.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
